name: app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  provider: ^6.1.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/app.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "lib/assets/app.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
